<div class="modal-overlay" (click)="onOverlayClick($event)">
  <div class="modal-panel" role="dialog" aria-modal="true">

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-header-left">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="modal-title">{{ existing ? 'Edit Chart' : 'Add New Chart' }}</span>
      </div>
      <button class="modal-close" (click)="onCancel()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">

      <!-- Chart Name -->
      <div class="form-group" [class.form-group--error]="errors['title']">
        <label class="form-label">Chart Name <span class="req">*</span></label>
        <input class="form-input" type="text" [(ngModel)]="title" placeholder="e.g. Product Distribution" maxlength="60"/>
        @if (errors['title']) { <span class="form-error">{{ errors['title'] }}</span> }
      </div>

      <!-- X / Y params -->
      <div class="form-row">
        <div class="form-group" [class.form-group--error]="errors['x']">
          <label class="form-label">X Parameter (Group By) <span class="req">*</span></label>
          <div class="form-select-wrap">
            <select class="form-select" [(ngModel)]="selectedXKey">
              <option value="" disabled>Select field…</option>
              @for (p of builderCfg.xParams; track p.key) {
                <option [value]="p.key">{{ p.label }}</option>
              }
            </select>
          </div>
          @if (errors['x']) { <span class="form-error">{{ errors['x'] }}</span> }
        </div>

        <div class="form-group">
          <label class="form-label">Y Parameter (Aggregate)</label>
          <div class="form-select-wrap">
            <select class="form-select" [(ngModel)]="selectedYKey">
              <option value="">Count (default)</option>
              @for (p of builderCfg.yParams; track p.key) {
                <option [value]="p.key">{{ p.label }}</option>
              }
            </select>
          </div>
          <span class="form-hint">Leave as "Count" to count rows per X group.</span>
        </div>
      </div>

      <!-- Chart Type -->
      <div class="form-group">
        <label class="form-label">Chart Type</label>
        <div class="chart-type-row">
          <button class="chart-type-btn" [class.chart-type-btn--active]="chartType==='bar'" type="button" (click)="chartType='bar'">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/>
            </svg>
            Bar Chart
          </button>
          <button class="chart-type-btn" [class.chart-type-btn--active]="chartType==='doughnut'" type="button" (click)="chartType='doughnut'">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>
            </svg>
            Doughnut
          </button>
        </div>
      </div>

      <!-- Date range -->
      @if (showDateRange) {
        <div class="form-group">
          <label class="form-label">Date Range <span class="form-hint-inline">(optional)</span></label>
          <div class="form-row" [class.form-group--error]="errors['date']">
            <div class="form-group" style="flex:1">
              <label class="form-sublabel">From</label>
              <input class="form-input" type="date" [(ngModel)]="fromDate"/>
            </div>
            <div class="form-group" style="flex:1">
              <label class="form-sublabel">To</label>
              <input class="form-input" type="date" [(ngModel)]="toDate"/>
            </div>
          </div>
          @if (errors['date']) { <span class="form-error">{{ errors['date'] }}</span> }
        </div>
      }

    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn-ghost" type="button" (click)="onCancel()">Cancel</button>
      <button class="btn-primary" type="button" (click)="onConfirm()">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        {{ existing ? 'Save Changes' : 'Add Chart' }}
      </button>
    </div>

  </div>
</div>
